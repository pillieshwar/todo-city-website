name: Build

# Type-checks, builds and prerenders the site on every push, so a broken
# build shows up here (with its errors) before Vercel tries to deploy it.

on:
  push:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          npm run build > build.log 2>&1 || {
            grep -A4 -E "error during build|error TS|Error:" build.log | head -n 10 | while IFS= read -r l; do echo "::error title=Build::$l"; done
            cat build.log
            exit 1
          }
          tail -n 5 build.log
          echo "::notice title=Built::$(grep -m1 prerendered build.log)"
          test -s dist/sitemap.xml && test -s dist/robots.txt
          grep -q '<main' dist/index.html
      - name: Accessibility (axe-core, WCAG 2.2 AA)
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund playwright@1.64.0 @axe-core/playwright@4.11.3 > install.log 2>&1 || { tail -n 5 install.log | while IFS= read -r l; do echo "::error title=install::$l"; done; exit 1; }
          npx playwright install --with-deps chromium > browser.log 2>&1 || { tail -n 5 browser.log | while IFS= read -r l; do echo "::error title=browser::$l"; done; exit 1; }
          npx vite preview --port 4173 --strictPort &
          sleep 3
          for page in / /things-3-alternative /move-from-things-3 /guides /faq; do
            node scripts/a11y.mjs "http://localhost:4173$page" 2>&1 | tee -a a11y.log || {
              grep -m3 -iE "error|cannot|failed" a11y.log | while IFS= read -r l; do echo "::error title=a11y script ($page)::$l"; done
              exit 1
            }
          done
      - name: Search basics
        run: |
          set -e
          for f in robots.txt sitemap.xml site.webmanifest og-image.png apple-touch-icon.png; do test -s "dist/$f"; done
          grep -q '<link rel="canonical"' dist/index.html
          grep -q '"@type":"FAQPage"' dist/index.html
          grep -q 'SoftwareApplication' dist/index.html
          # The guide pages, each with its own title, canonical link and structured data.
          test -s dist/llms.txt && test -s dist/llms-full.txt
          for page in things-3-alternative todoist-alternative move-from-things-3 guides faq; do
            f="dist/$page/index.html"
            test -s "$f"
            grep -q "<link rel=\"canonical\" href=\"https://todocity.app/$page\"" "$f"
            grep -q 'BreadcrumbList' "$f"
            grep -q '<h1' "$f"
          done
          urls=$(grep -c '<loc>' dist/sitemap.xml)
          echo "::notice title=Pages in the sitemap::$urls"
          test "$urls" -ge 14
          # The name is one word everywhere (the structured data's alternateName aside).
          if grep -rn "Todo City" dist --include=*.html --include=*.txt | grep -v alternateName | grep -q .; then
            echo "::error title=Name::'Todo City' should be 'TodoCity'"; exit 1
          fi
          words=$(sed -e 's/<[^>]*>/ /g' dist/index.html | wc -w)
          echo "::notice title=Words in the HTML before any JavaScript::$words"
